<!DOCTYPE html>
<html lang="en">
<head>
    <title>Delete Question</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Exact same CSS as delete_confirm.html */
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 3rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; text-align: center; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-cancel { display: inline-block; margin-left: 1rem; color: #6b7280; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #991b1b;">Warning!</h2>
        <p>Are you sure you want to delete this question?</p>
        <p style="font-size: 0.875rem; color: #4b5563; font-style: italic;">"{{ question.question_text }}"</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Yes, Delete Question</button>
            <a href="{% url 'course_questions' question.course.id %}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
