<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Question - NexaTest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-navy: #061e47;
            --accent-orange: #F26722;
            --danger: #ef4444;
            --card-border: rgba(255, 255, 255, 0.12);
            --text-muted: rgba(255, 255, 255, 0.7);
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0;
            font-family: 'Inter', sans-serif; 
            background: var(--bg-navy); 
            color: #ffffff;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 2.5rem 1rem; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.06); 
            backdrop-filter: blur(16px);
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            max-width: 440px; 
            width: 100%;
            text-align: center; 
            border: 1px solid var(--card-border);
        }

        .icon-warning {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h2 { margin: 0 0 0.75rem 0; color: #f87171; font-size: 1.6rem; font-weight: 800; }
        p { color: rgba(255, 255, 255, 0.9); font-size: 1rem; line-height: 1.5; margin: 0 0 1rem 0; }
        p.sub-warning { font-size: 0.95rem; color: #fbbf24; font-style: italic; margin-bottom: 2rem; background: rgba(0,0,0,0.25); padding: 0.8rem; border-radius: 6px; }

        .btn-row {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-danger { 
            background: var(--danger); 
            color: white; 
            border: none; 
            padding: 0.9rem; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            width: 100%;
        }
        .btn-danger:hover { 
            background: #dc2626; 
            transform: translateY(-2px);
        }

        .btn-cancel { 
            display: block; 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600; 
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }
        .btn-cancel:hover { 
            background: rgba(255, 255, 255, 0.08); 
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-warning">⚠️</div>
        <h2>Delete Question?</h2>
        <p>Are you sure you want to remove this question?</p>
        <p class="sub-warning">"{{ question.question_text }}"</p>
        
        <form method="POST" class="btn-row">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Yes, Delete Question</button>
            <a href="{% url 'course_questions' question.course.id %}" class="btn-cancel">Cancel and Keep</a>
        </form>
    </div>
</body>
</html>
