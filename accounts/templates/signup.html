<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - NexaTest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f4f7f6;
        }

        /* LEFT SIDE - BRANDING */
        .brand-panel {
            flex: 1;
            background-color: #061e47;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
        }
        
        .brand-panel h1 { font-size: 3rem; margin-bottom: 1rem; }
        .brand-panel h1 em { color: #F26722; font-style: normal; }
        .brand-panel p { color: rgba(255,255,255,0.7); font-size: 1.2rem; line-height: 1.6; }

        /* RIGHT SIDE - FORM */
        .form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .signup-card {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(6, 30, 71, 0.08);
            width: 100%;
            max-width: 450px;
        }

        .signup-card h2 { color: #061e47; margin-top: 0; margin-bottom: 2rem; font-size: 1.8rem; text-align: center}

        /* FORM ELEMENTS */
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #061e47; font-weight: 500; font-size: 0.9rem;}
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #F26722; }
        
        .btn-submit {
            width: 100%;
            background: #F26722;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(242, 103, 34, 0.3);
        }
        .login-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #061e47;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .login-link:hover { text-decoration: underline; color: #F26722; }
    </style>
</head>
<body>

    <div class="brand-panel">
        <h1>Welcome to <em>NexaTest</em></h1>
        <p>Student Portal Registration. Create an account to access your assigned examinations and track your results.</p>
    </div>

    <div class="form-panel">
        <div class="signup-card">
            <h2>Sign Up</h2>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>
            
            <a href="{% url 'login' %}" class="login-link">Already have an account? Log in here.</a>
        </div>
    </div>

</body>
</html>
