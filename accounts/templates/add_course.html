<!DOCTYPE html>
<html lang="en">
<head>
    <title>NexaTest - Manage Exam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 3rem; }
        .form-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { margin-top: 0; color: #111827; }
        .form-group p { display: flex; flex-direction: column; margin-bottom: 1rem; }
        input { padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 4px; margin-top: 0.25rem; font-family: 'Inter', sans-serif; }
        .btn-submit { background: #3b82f6; color: white; border: none; padding: 0.75rem; border-radius: 4px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 1rem; }
        .btn-cancel { display: block; text-align: center; margin-top: 1rem; color: #6b7280; text-decoration: none; font-weight: 600;}
    </style>
</head>
<body>
    <div class="form-container">
        <!-- This dynamically changes the title based on if you are editing or creating! -->
        <h2>{% if course %}Edit Exam: {{ course.course_name }}{% else %}Create New Exam{% endif %}</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn-submit">Save Exam</button>
            <a href="{% url 'teacher_dashboard' %}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
