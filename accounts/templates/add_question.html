<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question - {{ course.course_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #061e47; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
        }

        h2 { margin-top: 0; font-weight: 400; }
        h2 em { color: #F26722; font-style: normal; font-weight: 700; }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"], select, textarea {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.8rem;
            border-radius: 4px;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #F26722;
        }

        /* Dropdown specific styling */
        select option {
            background-color: #061e47; 
            color: white;
        }

        .btn-submit {
            background: #F26722;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-top: 1rem;
        }

        .btn-submit:hover { opacity: 0.9; }

        .btn-cancel {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            margin-left: 1rem;
            font-weight: 600;
        }
        
        .btn-cancel:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Add Question to <em>{{ course.course_name }}</em></h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Question Text</label>
                <textarea name="question_text" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label>Option 1</label>
                <input type="text" name="option1" required>
            </div>

            <div class="form-group">
                <label>Option 2</label>
                <input type="text" name="option2" required>
            </div>

            <div class="form-group">
                <label>Option 3</label>
                <input type="text" name="option3" required>
            </div>

            <div class="form-group">
                <label>Option 4</label>
                <input type="text" name="option4" required>
            </div>

            <div class="form-group">
                <label>Correct Answer</label>
                <select name="correct_option" required>
                    <option value="1">Option 1</option>
                    <option value="2">Option 2</option>
                    <option value="3">Option 3</option>
                    <option value="4">Option 4</option>
                </select>
            </div>

            <div class="form-group">
                <label>Marks for this Question</label>
                <input type="text" name="marks" value="1" required>
            </div>
            
            <button type="submit" class="btn-submit">Save Question</button>
            <a href="{% url 'course_questions' course.id %}" class="btn-cancel">Cancel</a>
        </form>
    </div>

</body>
</html>
