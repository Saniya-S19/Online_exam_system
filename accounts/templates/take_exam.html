<!DOCTYPE html>
<html>
<head>
    <title>NexaTest - {{ course.course_name }}</title>
</head>
<body>
    <h2>Exam: {{ course.course_name }}</h2>
    <p>Total Marks: {{ course.total_marks }}</p>

    <div style="background-color: #ffe4e6; color: #e11d48; padding: 10px; border-radius: 5px; font-weight: bold; width: 150px; text-align: center; margin-bottom: 20px;">
        Time Left: <span id="time-display">10:00</span>
    </div>

    <form method="POST" id="examForm">
        {% csrf_token %}
        
        {% for q in questions %}
            <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px;">
                <p>
                    <strong>
                        {{ forloop.counter }}. {{ q.question_text }}
                    </strong>
                </p>

                <input type="radio" name="question_{{ q.id }}" value="{{ q.option1 }}" required> {{ q.option1 }}<br>
                <input type="radio" name="question_{{ q.id }}" value="{{ q.option2 }}"> {{ q.option2 }}<br>
                <input type="radio" name="question_{{ q.id }}" value="{{ q.option3 }}"> {{ q.option3 }}<br>
                <input type="radio" name="question_{{ q.id }}" value="{{ q.option4 }}"> {{ q.option4 }}<br>
            </div>
        {% endfor %}
        
        <button type="submit" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px;">Submit Exam</button>
    </form>

    <script>
        
        let timeInMinutes = 10;
        let timeInSeconds = timeInMinutes * 60;
        
        
        const timeDisplay = document.getElementById('time-display');
        const examForm = document.getElementById('examForm');

        
        const countdown = setInterval(function() {
            timeInSeconds--;

            
            let minutes = Math.floor(timeInSeconds / 60);
            let seconds = timeInSeconds % 60;

            
            if (seconds < 10) {
                seconds = "0" + seconds;
            }

            timeDisplay.textContent = minutes + ":" + seconds;

            if (timeInSeconds <= 0) {
                clearInterval(countdown); 
                timeDisplay.textContent = "0:00";
                
                alert("Time is up! Submitting your exam automatically.");
                
                examForm.submit();
            }
        }, 1000);
    </script>

</body>
</html>
