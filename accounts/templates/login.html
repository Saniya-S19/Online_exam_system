<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexaTest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #061e47; /* Solid Navy Background */
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Decorative background elements to make the glass pop */
        .bg-circle-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(242, 103, 34, 0.15); /* Faint orange glow */
            border-radius: 50%;
            top: -100px;
            left: -100px;
            filter: blur(60px);
        }
        .bg-circle-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            filter: blur(40px);
        }

        /* THE FROSTED GLASS CARD */
        .glass-card {
            background: rgba(255, 255, 255, 0.08); /* Semi-transparent white */
            backdrop-filter: blur(16px); /* The magic blur effect */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            z-index: 10; /* Keeps it above the background circles */
        }

        .glass-card h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            text-align: center;
            font-weight: 700;
        }
        
        .glass-card h2 em {
            color: #F26722;
            font-style: normal;
        }

        .glass-card p {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* FORM ELEMENTS */
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: rgba(255, 255, 255, 0.9); 
            font-weight: 500; 
            font-size: 0.9rem;
        }
        
        /* Glass inputs */
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        
        .form-group input:focus { 
            outline: none; 
            border-color: #F26722; 
            background: rgba(0, 0, 0, 0.4);
        }

        /* PASSWORD SPECIFIC STYLES */
        .password-wrapper { position: relative; }
        .toggle-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            user-select: none;
        }

        /* ALERT MESSAGES */
        .alert {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ffb3b3;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .btn-submit {
            width: 100%;
            background: #F26722;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 1rem;
        }
        .btn-submit:hover {
            background: #e05a18;
            transform: translateY(-2px);
        }
        
        .signup-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .signup-link:hover { color: #F26722; }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            color: #F26722; /* Lights up orange on hover */
        }

        .back-btn:hover svg {
            transform: translateX(-5px); /* Cute slide-left animation */
        }
    </style>
</head>
<body>
    <!-- Floating Back Button -->
    <a href="{% url 'home' %}" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <!-- Background Decoration -->
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>

    <div class="glass-card">
        <h2><em>Nexa</em>Test</h2>
        <p>Log in to your account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="pwdInput" required>
                    <span class="toggle-eye" onclick="togglePassword()">👁️</span>
                </div>
            </div>

            <button type="submit" class="btn-submit">Log In</button>
        </form>
        
        <a href="{% url 'signup' %}" class="signup-link">Don't have an account? Sign up</a>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById("pwdInput");
            const eye = document.querySelector(".toggle-eye");
            
            if (pwd.type === "password") {
                pwd.type = "text";
                eye.textContent = "🙈"; 
            } else {
                pwd.type = "password";
                eye.textContent = "👁️"; 
            }
        }
    </script>
</body>
</html>
