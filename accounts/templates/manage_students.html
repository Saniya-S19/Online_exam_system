<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - {{ course.course_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #061e47; 
            color: #ffffff;
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 8px;
        }
        h2 { font-weight: 400; margin-top: 0; margin-bottom: 2rem; }
        h2 em { color: #F26722; font-style: normal; font-weight: 700; }
        
        .student-list {
            list-style: none;
            padding: 0;
            margin-bottom: 2rem;
        }
        .student-list li {
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 0.5rem;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .student-list label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 1.1rem;
        }
        input[type="checkbox"] {
            margin-right: 15px;
            width: 18px;
            height: 18px;
            accent-color: #F26722;
        }
        .btn-submit {
            background: #F26722;
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; }
        .back-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            margin-left: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Manage Students for <em>{{ course.course_name }}</em></h2>
        
        <form method="POST">
            {% csrf_token %}
            <ul class="student-list">
                {% for student in students %}
                    <li>
                        <label>
                            <input type="checkbox" name="students" value="{{ student.id }}" 
                            {% if student in course.enrolled_students.all %}checked{% endif %}>
                            
                            {{ student.username }} 
                        </label>
                    </li>
                {% empty %}
                    <p style="color: rgba(255,255,255,0.5);">No students found in the system.</p>
                {% endfor %}
            </ul>
            
            <button type="submit" class="btn-submit">Save Enrollments</button>
            <a href="{% url 'teacher_dashboard' %}" class="back-link">Cancel</a>
        </form>
    </div>

</body>
</html>
